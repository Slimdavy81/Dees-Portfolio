<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Luis Royo — Gallery</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="luis-royo.css">
	<link rel="stylesheet" href="gallery-settings.css">
	<link rel="stylesheet" href="luis-royo-gate.css">
	<script src="gallery-settings.js"></script>
	<script src="luis-royo-gate.js"></script>
</head>
<body>

	<div id="royo-gate" class="royo-gate" role="dialog" aria-modal="true" aria-labelledby="royo-gate-title">
		<div class="royo-gate__panel">
			<h2 id="royo-gate-title" class="royo-gate__title">Luis Royo</h2>
			<p class="royo-gate__text">This gallery is password protected. Enter the password to continue.</p>
			<form id="royo-gate-form" class="royo-gate__form" autocomplete="off">
				<label class="royo-gate__label" for="royo-gate-password">Password</label>
				<input type="password" id="royo-gate-password" class="royo-gate__input" required autocomplete="current-password">
				<p id="royo-gate-error" class="royo-gate__error" hidden></p>
				<button type="submit" class="royo-gate__submit">Enter gallery</button>
			</form>
			<a href="index.html" class="royo-gate__back">← Back to main gallery</a>
		</div>
	</div>

	<div class="slideshow royo-slideshow">
		<header class="slideshow-header">
			<a href="index.html" class="btn-back">← Back to gallery</a>
			<h1>Luis Royo</h1>
			<div class="header-meta">
				<span class="counter" id="slide-counter">1 / 1</span>
				<button type="button" class="btn-playpause" id="btn-playpause" aria-label="Pause slideshow">❚❚</button>
			</div>
		</header>

		<div class="slideshow-stage" id="slideshow-stage">
			<button type="button" class="btn-nav btn-nav--prev" id="btn-prev" aria-label="Previous image">‹</button>
			<div class="slideshow-frame" id="slideshow-frame" aria-live="polite">
				<div class="carousel-track" id="carousel-track"></div>
				<nav class="carousel-dots" id="carousel-dots" aria-label="Slide indicators"></nav>
			</div>
			<button type="button" class="btn-nav btn-nav--next" id="btn-next" aria-label="Next image">›</button>
		</div>

		<nav class="slideshow-thumbs" id="slideshow-thumbs" aria-label="Image thumbnails"></nav>
	</div>

</body>
</html>
